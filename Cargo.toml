[package]
name = "rshot"
version = "0.3.0-rc.2"
edition = "2024"

[dependencies]
xcap = "0.9.6"
mouse_position = "0.1.4"
global-hotkey = "0.8.0"
windows = { version = "0.62.2", features = ["Globalization", "Graphics_Imaging", "Media_Ocr", "Storage_Streams", "Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_UI_HiDpi", "Win32_Graphics_Dwm", "Win32_Graphics_Gdi", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Ole", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Threading", "Win32_System_WinRT", "Win32_UI_Shell"] }
serde = "1.0.228"
winit = "0.31.0-beta.2"
softbuffer = "0.4.8"
tray-icon = "0.19"
oar-ocr = { version = "0.9.1", default-features = false, features = ["simd"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "ndarray", "tracing", "load-dynamic", "api-17"] }

[build-dependencies]
sha2 = "0.11.0"
ureq = "3.4.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }


[dependencies.confy]
version = "2.0.0"           # ← 补上,填你 cargo add 装到的版本
features = ["yaml_conf"]
default-features = false
